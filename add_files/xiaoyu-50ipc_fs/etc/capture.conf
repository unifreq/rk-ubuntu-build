#ENCODER_CODEC="hevc_rkmpp"
#ENCODER_BITRATE="16M"
#ENCODER_GOP="60"
#ENCODER_RC_MODE="AVBR"
#ENCODER_EXTRA="-level 5.1 -tier main"

# ========== 编码速查表 ==========
# 分辨率      帧率   H.264   HEVC    GOP   典型场景 (均为 CBR 推荐码率)
# ----------- ------ ------- ------- -----  ---------------------------
# 640x480     25fps  1M      0.6M    50    低成本流
# 1280x720    30fps  4M      2.5M    60    标清直播
# 1920x1080   30fps  6M      4M      60    高清直播
# 1920x1080   60fps 12M      8M     120    高帧率高清
# 2560x1440   30fps 16M      9M      60    2K 监控 (默认, CBR 高清高质量)
# 2560x1440   60fps 18M     11M     120    2K 高帧率
# 3840x2160   30fps 24M     16M      60    4K 超高清
# 480x800     30fps  2M      1.2M    60    竖屏 DSI
# 说明: 默认情况下采用CBR(固定码率)，若RC_MODE 改为 VBR/AVBR, 码率边界会自动调整
# -----------------------------------------------------------------------
