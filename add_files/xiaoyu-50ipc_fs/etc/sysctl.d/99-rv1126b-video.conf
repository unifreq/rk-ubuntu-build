# =====================
# RV1126B 视频推流/拉流/存储调优
# 根据实际内存取消注释对应的一组参数
# =====================

# 总体策略：频繁、微量地刷盘，不让脏数据在内存中积压超过 2 秒，迅速释放文件节点

# ---------- 内存 / 存储回写 ----------
vm.swappiness = 5
vm.vfs_cache_pressure = 200
vm.dirty_expire_centisecs = 200
vm.dirty_writeback_centisecs = 100

# 显式关闭百分比控制，激活下面的字节控制（防止内核默认值干扰）
vm.dirty_background_ratio = 0
vm.dirty_ratio = 0

# --- 1GB 内存 ---
vm.dirty_background_bytes = 8388608
vm.dirty_bytes = 33554432
vm.min_free_kbytes = 32768

# --- 2GB 内存 ---
# vm.dirty_background_bytes = 16777216
# vm.dirty_bytes = 67108864
# vm.min_free_kbytes = 49152

# --- 4GB 内存 ---
# vm.dirty_background_bytes = 33554432
# vm.dirty_bytes = 134217728
# vm.min_free_kbytes = 65536

# ---------- 网络核心缓冲 ----------
net.core.rmem_default = 524288
net.core.wmem_default = 524288

# --- 1GB 内存 ---
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304

# --- 2GB 内存 ---
# net.core.rmem_max = 6291456
# net.core.wmem_max = 6291456

# --- 4GB 内存 ---
net.core.rmem_max = 8388608
net.core.wmem_max = 8388608

net.core.netdev_max_backlog = 4096
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 8000
net.core.dev_weight = 128
net.core.somaxconn = 4096
net.core.optmem_max = 131072
net.core.default_qdisc = fq_codel


# ---------- TCP ----------
# --- 1GB 内存 ---
net.ipv4.tcp_rmem = 4096 524288 4194304
net.ipv4.tcp_wmem = 4096 524288 4194304
net.ipv4.tcp_mem = 32768 43690 65536

# --- 2GB 内存 ---
# net.ipv4.tcp_rmem = 4096 1048576 6291456
# net.ipv4.tcp_wmem = 4096 1048576 6291456
# net.ipv4.tcp_mem = 49152 65536 98304

# --- 4GB 内存 ---
# net.ipv4.tcp_rmem = 4096 1048576 8388608
# net.ipv4.tcp_wmem = 4096 1048576 8388608
# net.ipv4.tcp_mem = 65536 87381 131072

net.ipv4.tcp_fin_timeout = 30
net.ipv4.tcp_tw_reuse = 2
net.ipv4.tcp_max_tw_buckets = 131072
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 3
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_syncookies = 1

# 如果经过公网推流/播放偶发卡顿、马赛克，可尝试关闭 ECN
# net.ipv4.tcp_ecn = 0


# ---------- 文件/内核 ----------
fs.inotify.max_user_watches = 1048576
kernel.sched_autogroup_enabled = 1
kernel.sched_rt_runtime_us = 950000
kernel.timer_migration = 1
